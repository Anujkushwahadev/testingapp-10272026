
name: Deploy React App to VM Server

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Setup Node.js Environment
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build React App
        run: npm run build

      - name: Deploy to VM Server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.49.14.136.17 }}
          username: ${{ secrets.a_dimogia }}
          key: ${{ secrets.id_ed25519 }}
          port: 22
          script: |
            set -eu
            cd /var/www/testingapp-10272026
            git pull --ff-only origin master
            echo "Deployment source updated successfully!"
